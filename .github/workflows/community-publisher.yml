name: 社区内容发布

on:
  workflow_dispatch:
    inputs:
      action:
        description: 选择要执行的发布动作
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - sync
          - digest
  schedule:
    - cron: "17 */6 * * *"
    - cron: "0 12 * * 0"

permissions:
  contents: read
  discussions: write
  packages: read

env:
  ORG_NAME: LingXi-Org
  SOURCE_REPO: .github
  ANNOUNCEMENTS_SLUG: announcements

jobs:
  bootstrap:
    name: 发布组织总览
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'bootstrap'
    runs-on: ubuntu-latest
    steps:
      - name: 发布中文组织技术与社区总览
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          context="$(
            gh api graphql \
              -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){id discussionCategories(first:50){nodes{id slug}} discussions(first:100,orderBy:{field:UPDATED_AT,direction:DESC}){nodes{body}}}}' \
              -F owner="$ORG_NAME" -F name="$SOURCE_REPO"
          )"
          repo_id="$(jq -r '.data.repository.id // empty' <<<"$context")"
          category_id="$(jq -r --arg slug "$ANNOUNCEMENTS_SLUG" '.data.repository.discussionCategories.nodes[] | select(.slug==$slug) | .id' <<<"$context")"

          if [ -z "$repo_id" ] || [ -z "$category_id" ]; then
            echo "::error::未找到公告分类的英文 slug：announcements。请确认分类显示名为中文“公告”，底层 slug 为 announcements。"
            exit 1
          fi

          marker="<!-- lingxi-auto:organization-overview:zh-v1 -->"
          if jq -r '.data.repository.discussions.nodes[]?.body' <<<"$context" | grep -Fq "$marker"; then
            echo "中文组织总览已存在，无需重复发布。"
            exit 0
          fi

          repos="$(
            gh api "/orgs/$ORG_NAME/repos?type=public&per_page=100" \
              --jq '.[] | [.name, .html_url] | @tsv'
          )"

          cat > /tmp/body.md <<EOF
          $marker
          # LingXi

          **一切皆技能，状态决定下一步。**

          LingXi 是围绕 AI 学习产品、持久化智能体运行时、开放技能体系与统一身份能力持续演进的开源工程体系。

          ## 核心技术栈

          | 项目 | 定位 |
          | --- | --- |
          | [LingxiLearn](https://github.com/$ORG_NAME/LingxiLearn) | 面向个人学习任务的多智能体 AI 学习工作台 |
          | [LingxiGraph](https://github.com/$ORG_NAME/LingxiGraph) | 可恢复、可持久化、可审计的智能体图运行时 |
          | [LingxiSkills](https://github.com/$ORG_NAME/LingxiSkills) | 可复用智能体技能与人类可读技能文档 |
          | [LingxiIdentity](https://github.com/$ORG_NAME/LingxiIdentity) | LingXi 的统一身份与 OIDC 边界 |
          | [LingxiNext](https://github.com/$ORG_NAME/LingxiNext) | 基于 LingxiGraph 的多智能体编排与运行体验 |

          ## 公开仓库

          EOF

          while IFS=$'\t' read -r name url; do
            [ "$name" = ".github" ] && continue
            printf -- "- **[%s](%s)**\n" "$name" "$url" >> /tmp/body.md
          done <<<"$repos"

          cat >> /tmp/body.md <<'EOF'

          ## 社区入口

          - **想法与需求**：提出需求，在维护者审批后进入对应仓库议题。
          - **共建实验室 / 每周任务**：参与周期性工程与研究任务。
          - **共建实验室 / 任务提交**：提交独立成果、拉取请求、演示与验证结果。
          - **技术札记**：沉淀架构、工程、研究与实验文章。

          版本发布、新仓库和每周开发摘要可以由社区自动化同步到公告分类。配置可选的 `ORG_PACKAGE_TOKEN` 后，也可以同步组织级 GHCR 软件包。
          EOF

          title="欢迎来到 LingXi — 架构、项目与当前状态"
          body="$(cat /tmp/body.md)"
          gh api graphql \
            -f query='mutation($repository:ID!,$category:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repository,categoryId:$category,title:$title,body:$body}){discussion{url}}}' \
            -F repository="$repo_id" -F category="$category_id" -f title="$title" -f body="$body"

  sync:
    name: 同步版本、软件包与新仓库
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.action == 'bootstrap' || inputs.action == 'sync')) ||
      (github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *' && vars.DISCUSSIONS_AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: 发布新的开发事件
        env:
          GH_TOKEN: ${{ github.token }}
          ORG_PACKAGE_TOKEN: ${{ secrets.ORG_PACKAGE_TOKEN }}
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'bootstrap' }}
        shell: bash
        run: |
          set -euo pipefail

          context="$(
            gh api graphql \
              -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){id discussionCategories(first:50){nodes{id slug}} discussions(first:100,orderBy:{field:UPDATED_AT,direction:DESC}){nodes{body}}}}' \
              -F owner="$ORG_NAME" -F name="$SOURCE_REPO"
          )"
          repo_id="$(jq -r '.data.repository.id // empty' <<<"$context")"
          category_id="$(jq -r --arg slug "$ANNOUNCEMENTS_SLUG" '.data.repository.discussionCategories.nodes[] | select(.slug==$slug) | .id' <<<"$context")"
          [ -n "$repo_id" ] && [ -n "$category_id" ] || { echo "::error::未找到公告分类的英文 slug：announcements。"; exit 1; }

          discussions="$(jq -r '.data.repository.discussions.nodes[]?.body' <<<"$context")"

          publish_once() {
            local marker="$1"
            local title="$2"
            local file="$3"

            if grep -Fq "$marker" <<<"$discussions"; then
              echo "已发布，跳过：$title"
              return 0
            fi

            local body
            body="$(cat "$file")"
            gh api graphql \
              -f query='mutation($repository:ID!,$category:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repository,categoryId:$category,title:$title,body:$body}){discussion{url}}}' \
              -F repository="$repo_id" -F category="$category_id" -f title="$title" -f body="$body" >/dev/null
            discussions+=$'\n'"$body"
            echo "已发布：$title"
          }

          json_array_or_empty() {
            local value="$1"
            if jq -e 'type == "array"' >/dev/null 2>&1 <<<"$value"; then
              printf '%s\n' "$value"
            else
              printf '[]\n'
            fi
          }

          now_epoch="$(date -u +%s)"
          cutoff_epoch="$((now_epoch - 48 * 3600))"
          repos_json="$(gh api "/orgs/$ORG_NAME/repos?type=public&per_page=100")"
          repos_json="$(json_array_or_empty "$repos_json")"

          if [ "$BOOTSTRAP" != "true" ]; then
            while read -r repo; do
              [ -n "$repo" ] || continue
              created="$(jq -r '.created_at' <<<"$repo")"
              created_epoch="$(date -u -d "$created" +%s)"
              [ "$created_epoch" -lt "$cutoff_epoch" ] && continue

              name="$(jq -r '.name' <<<"$repo")"
              url="$(jq -r '.html_url' <<<"$repo")"
              marker="<!-- lingxi-auto:new-repo:zh:$name -->"

              cat > /tmp/item.md <<EOF
          $marker
          # 新仓库：$name

          LingXi 组织新增公开仓库 **$name**。

          **仓库地址：** $url

          后续重要版本与开发进展可以继续在公告分类中发布。
          EOF
              publish_once "$marker" "[新仓库] $name" /tmp/item.md
            done < <(jq -c '.[] | select(.name != ".github")' <<<"$repos_json")
          fi

          while read -r full_name; do
            [ -n "$full_name" ] || continue
            releases="$(gh api "/repos/$full_name/releases?per_page=10" 2>/dev/null || true)"
            releases="$(json_array_or_empty "$releases")"

            if [ "$BOOTSTRAP" = "true" ]; then
              releases="$(jq '[map(select(.draft == false))[0]] | map(select(. != null))' <<<"$releases")"
            fi

            while read -r release; do
              [ -n "$release" ] || continue
              if [ "$BOOTSTRAP" != "true" ]; then
                published="$(jq -r '.published_at // .created_at' <<<"$release")"
                published_epoch="$(date -u -d "$published" +%s)"
                [ "$published_epoch" -lt "$cutoff_epoch" ] && continue
              fi

              repo="${full_name#*/}"
              tag="$(jq -r '.tag_name' <<<"$release")"
              url="$(jq -r '.html_url' <<<"$release")"
              prerelease="$(jq -r 'if .prerelease then "是" else "否" end' <<<"$release")"
              marker="<!-- lingxi-auto:release:zh:$repo:$tag -->"

              cat > /tmp/item.md <<EOF
          $marker
          # $repo $tag

          - **仓库：** https://github.com/$full_name
          - **版本页面：** $url
          - **是否为预发布版本：** $prerelease

          完整变更、安装与迁移信息以版本页面为准。
          EOF
              publish_once "$marker" "[版本发布] $repo $tag" /tmp/item.md
            done < <(jq -c '.[] | select(.draft == false)' <<<"$releases")
          done < <(jq -r '.[].full_name' <<<"$repos_json")

          package_token="${ORG_PACKAGE_TOKEN:-$GH_TOKEN}"
          package_error="/tmp/package-api-error.txt"
          : > "$package_error"

          if packages="$(GH_TOKEN="$package_token" gh api "/orgs/$ORG_NAME/packages?package_type=container&per_page=100" 2>"$package_error")"; then
            if ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$packages"; then
              echo "::warning::软件包接口返回了非预期数据，本次跳过软件包公告。"
              packages='[]'
            fi
          else
            echo "::warning::当前凭据无法读取组织级软件包。本次仍会正常处理版本、新仓库和开发摘要；如需启用软件包公告，请配置 ORG_PACKAGE_TOKEN。"
            packages='[]'
          fi

          while read -r package; do
            [ -n "$package" ] || continue
            package_name="$(jq -r '.name' <<<"$package")"
            encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$package_name")"

            if versions="$(GH_TOKEN="$package_token" gh api "/orgs/$ORG_NAME/packages/container/$encoded/versions?per_page=5" 2>/dev/null)"; then
              versions="$(json_array_or_empty "$versions")"
            else
              echo "::warning::无法读取软件包 $package_name 的版本信息，本次跳过。"
              continue
            fi

            if [ "$BOOTSTRAP" = "true" ]; then
              versions="$(jq '.[0:1]' <<<"$versions")"
            fi

            while read -r version; do
              [ -n "$version" ] || continue
              created="$(jq -r '.created_at' <<<"$version")"
              created_epoch="$(date -u -d "$created" +%s)"
              if [ "$BOOTSTRAP" != "true" ] && [ "$created_epoch" -lt "$cutoff_epoch" ]; then
                continue
              fi

              version_id="$(jq -r '.id' <<<"$version")"
              tags="$(jq -r '.metadata.container.tags // [] | join(", ")' <<<"$version")"
              marker="<!-- lingxi-auto:package:zh:$package_name:$version_id -->"
              package_url="https://github.com/orgs/$ORG_NAME/packages/container/package/$encoded"

              cat > /tmp/item.md <<EOF
          $marker
          # 软件包更新：$package_name

          - **软件包：** $package_url
          - **标签：** ${tags:-无标签}
          - **发布时间：** $created

          该通知由 LingXi 社区发布器自动同步。
          EOF
              publish_once "$marker" "[软件包] $package_name ${tags:+— $tags}" /tmp/item.md
            done < <(jq -c '.[]' <<<"$versions")
          done < <(jq -c '.[]' <<<"$packages")

  digest:
    name: 发布每周开发摘要
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.action == 'bootstrap' || inputs.action == 'digest')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 0' && vars.DISCUSSIONS_AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: 汇总并发布开发进展
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'bootstrap' }}
        shell: bash
        run: |
          set -euo pipefail

          context="$(
            gh api graphql \
              -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){id discussionCategories(first:50){nodes{id slug}} discussions(first:100,orderBy:{field:UPDATED_AT,direction:DESC}){nodes{body}}}}' \
              -F owner="$ORG_NAME" -F name="$SOURCE_REPO"
          )"
          repo_id="$(jq -r '.data.repository.id // empty' <<<"$context")"
          category_id="$(jq -r --arg slug "$ANNOUNCEMENTS_SLUG" '.data.repository.discussionCategories.nodes[] | select(.slug==$slug) | .id' <<<"$context")"
          [ -n "$repo_id" ] && [ -n "$category_id" ] || { echo "::error::未找到公告分类的英文 slug：announcements。"; exit 1; }

          if [ "$BOOTSTRAP" = "true" ]; then
            since="$(date -u -d '30 days ago' +%F)"
            period="当前开发快照"
            marker="<!-- lingxi-auto:development-snapshot:zh-v1 -->"
            title="[开发进展] 当前开发快照"
          else
            since="$(date -u -d '7 days ago' +%F)"
            week="$(date -u +%G-W%V)"
            period="$week"
            marker="<!-- lingxi-auto:weekly-digest:$week -->"
            title="[开发进展] $week — LingXi 每周开发摘要"
          fi

          if jq -r '.data.repository.discussions.nodes[]?.body' <<<"$context" | grep -Fq "$marker"; then
            echo "对应开发摘要已存在，无需重复发布。"
            exit 0
          fi

          query="org:$ORG_NAME is:pr is:merged merged:>=$since"
          prs="$(gh api --method GET /search/issues -f q="$query" -f per_page=100 --jq '.items')"

          cat > /tmp/body.md <<EOF
          $marker
          # $period

          本摘要聚合 LingXi 组织最近的已合并开发活动，便于社区快速了解当前工程进展。

          ## 已合并的拉取请求

          EOF

          count="$(jq 'length' <<<"$prs")"
          if [ "$count" -eq 0 ]; then
            echo "- 本周期暂无已合并的拉取请求。" >> /tmp/body.md
          else
            jq -r '.[] | "- [" + (.repository_url | sub("https://api.github.com/repos/"; "")) + "#" + ((.pull_request.url | split("/") | last)) + "](" + .html_url + ") — @" + .user.login' <<<"$prs" >> /tmp/body.md
          fi

          cat >> /tmp/body.md <<EOF

          ---
          统计范围：自 **$since** 起已合并的拉取请求。
          EOF

          body="$(cat /tmp/body.md)"
          gh api graphql \
            -f query='mutation($repository:ID!,$category:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repository,categoryId:$category,title:$title,body:$body}){discussion{url}}}' \
            -F repository="$repo_id" -F category="$category_id" -f title="$title" -f body="$body"
