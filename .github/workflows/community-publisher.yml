name: Community Publisher

on:
  workflow_dispatch:
    inputs:
      action:
        description: What should be published
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - sync
          - digest
  schedule:
    - cron: "17 */6 * * *"
    - cron: "0 12 * * 0"

permissions:
  contents: read
  discussions: write
  packages: read

env:
  ORG_NAME: LingXi-Org
  SOURCE_REPO: .github
  ANNOUNCEMENTS_SLUG: announcements

jobs:
  bootstrap:
    name: Publish organization overview
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'bootstrap'
    runs-on: ubuntu-latest
    steps:
      - name: Publish overview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          context="$(
            gh api graphql \
              -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){id discussionCategories(first:50){nodes{id slug}} discussions(first:100,orderBy:{field:UPDATED_AT,direction:DESC}){nodes{body}}}}' \
              -F owner="$ORG_NAME" -F name="$SOURCE_REPO"
          )"
          repo_id="$(jq -r '.data.repository.id // empty' <<<"$context")"
          category_id="$(jq -r --arg slug "$ANNOUNCEMENTS_SLUG" '.data.repository.discussionCategories.nodes[] | select(.slug==$slug) | .id' <<<"$context")"

          if [ -z "$repo_id" ] || [ -z "$category_id" ]; then
            echo "::error::Enable Organization Discussions with LingXi-Org/.github as source and create the Announcements category first."
            exit 1
          fi

          marker="<!-- lingxi-auto:organization-overview:v1 -->"
          if jq -r '.data.repository.discussions.nodes[]?.body' <<<"$context" | grep -Fq "$marker"; then
            echo "Organization overview already exists."
            exit 0
          fi

          repos="$(
            gh api "/orgs/$ORG_NAME/repos?type=public&per_page=100" \
              --jq '.[] | [.name, (.description // ""), .html_url] | @tsv'
          )"

          cat > /tmp/body.md <<EOF
          $marker
          # LingXi

          **Everything is a Skill. State decides next.**

          LingXi 是围绕 AI 学习产品、持久化 Agent Runtime、开放 Skills 与统一身份能力持续演进的开源工程体系。

          ## Core stack

          | Project | Role |
          | --- | --- |
          | [LingxiLearn](https://github.com/$ORG_NAME/LingxiLearn) | 面向个人学习任务的多智能体 AI 学习工作台 |
          | [LingxiGraph](https://github.com/$ORG_NAME/LingxiGraph) | 可恢复、可持久化、可审计的 Agent 图运行时 |
          | [LingxiSkills](https://github.com/$ORG_NAME/LingxiSkills) | 可复用 Agent Skills 与人类可读技能文档 |
          | [LingxiIdentity](https://github.com/$ORG_NAME/LingxiIdentity) | LingXi 的统一身份与 OIDC 边界 |
          | [LingxiNext](https://github.com/$ORG_NAME/LingxiNext) | 基于 LingxiGraph 的多智能体编排与运行体验 |

          ## Repository map

          EOF

          while IFS=$'\t' read -r name description url; do
            [ "$name" = ".github" ] && continue
            printf -- "- **[%s](%s)** — %s\n" "$name" "$url" "${description:-No description}" >> /tmp/body.md
          done <<<"$repos"

          cat >> /tmp/body.md <<'EOF'

          ## Community

          - **Ideas and Requests**：提出需求，在维护者审批后进入对应仓库 Issue。
          - **Build Lab / Weekly Missions**：参与周期性工程与研究任务。
          - **Build Lab / Submissions**：提交独立成果、PR、Demo 与验证结果。
          - **Engineering Notes**：沉淀架构、工程、研究与实验文章。

          Release、新仓库和每周开发摘要由社区自动化持续同步到本分类。配置可选的 `ORG_PACKAGE_TOKEN` 后，也会同步组织级 GHCR Package。
          EOF

          title="Welcome to LingXi — Architecture, Projects & Current Status"
          body="$(cat /tmp/body.md)"
          gh api graphql \
            -f query='mutation($repository:ID!,$category:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repository,categoryId:$category,title:$title,body:$body}){discussion{url}}}' \
            -F repository="$repo_id" -F category="$category_id" -f title="$title" -f body="$body"

  sync:
    name: Sync releases packages and repositories
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.action == 'bootstrap' || inputs.action == 'sync')) ||
      (github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *' && vars.DISCUSSIONS_AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Publish new development events
        env:
          GH_TOKEN: ${{ github.token }}
          ORG_PACKAGE_TOKEN: ${{ secrets.ORG_PACKAGE_TOKEN }}
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'bootstrap' }}
        shell: bash
        run: |
          set -euo pipefail

          context="$(
            gh api graphql \
              -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){id discussionCategories(first:50){nodes{id slug}} discussions(first:100,orderBy:{field:UPDATED_AT,direction:DESC}){nodes{body}}}}' \
              -F owner="$ORG_NAME" -F name="$SOURCE_REPO"
          )"
          repo_id="$(jq -r '.data.repository.id // empty' <<<"$context")"
          category_id="$(jq -r --arg slug "$ANNOUNCEMENTS_SLUG" '.data.repository.discussionCategories.nodes[] | select(.slug==$slug) | .id' <<<"$context")"
          [ -n "$repo_id" ] && [ -n "$category_id" ] || { echo "::error::Missing Announcements category."; exit 1; }

          discussions="$(jq -r '.data.repository.discussions.nodes[]?.body' <<<"$context")"

          publish_once() {
            local marker="$1"
            local title="$2"
            local file="$3"
            if grep -Fq "$marker" <<<"$discussions"; then
              echo "Already published: $marker"
              return 0
            fi

            local body
            body="$(cat "$file")"
            gh api graphql \
              -f query='mutation($repository:ID!,$category:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repository,categoryId:$category,title:$title,body:$body}){discussion{url}}}' \
              -F repository="$repo_id" -F category="$category_id" -f title="$title" -f body="$body" >/dev/null
            discussions+=$'\n'"$body"
            echo "Published: $title"
          }

          json_array_or_empty() {
            local value="$1"
            if jq -e 'type == "array"' >/dev/null 2>&1 <<<"$value"; then
              printf '%s\n' "$value"
            else
              printf '[]\n'
            fi
          }

          now_epoch="$(date -u +%s)"
          cutoff_epoch="$((now_epoch - 48 * 3600))"
          repos_json="$(gh api "/orgs/$ORG_NAME/repos?type=public&per_page=100")"
          repos_json="$(json_array_or_empty "$repos_json")"

          if [ "$BOOTSTRAP" != "true" ]; then
            while read -r repo; do
              [ -n "$repo" ] || continue
              created="$(jq -r '.created_at' <<<"$repo")"
              created_epoch="$(date -u -d "$created" +%s)"
              [ "$created_epoch" -lt "$cutoff_epoch" ] && continue

              name="$(jq -r '.name' <<<"$repo")"
              url="$(jq -r '.html_url' <<<"$repo")"
              description="$(jq -r '.description // "No description"' <<<"$repo")"
              marker="<!-- lingxi-auto:new-repo:$name -->"

              cat > /tmp/item.md <<EOF
          $marker
          # New repository: $name

          $description

          **Repository:** $url

          这是 LingXi 组织自动发布的新仓库通知。后续重要版本与开发进展会继续同步到 Announcements。
          EOF
              publish_once "$marker" "[New Repository] $name" /tmp/item.md
            done < <(jq -c '.[] | select(.name != ".github")' <<<"$repos_json")
          fi

          while read -r full_name; do
            [ -n "$full_name" ] || continue
            releases="$(gh api "/repos/$full_name/releases?per_page=10" 2>/dev/null || true)"
            releases="$(json_array_or_empty "$releases")"

            if [ "$BOOTSTRAP" = "true" ]; then
              releases="$(jq '[map(select(.draft == false))[0]] | map(select(. != null))' <<<"$releases")"
            fi

            while read -r release; do
              [ -n "$release" ] || continue
              if [ "$BOOTSTRAP" != "true" ]; then
                published="$(jq -r '.published_at // .created_at' <<<"$release")"
                published_epoch="$(date -u -d "$published" +%s)"
                [ "$published_epoch" -lt "$cutoff_epoch" ] && continue
              fi

              repo="${full_name#*/}"
              tag="$(jq -r '.tag_name' <<<"$release")"
              name="$(jq -r '.name // empty' <<<"$release")"
              url="$(jq -r '.html_url' <<<"$release")"
              prerelease="$(jq -r '.prerelease' <<<"$release")"
              marker="<!-- lingxi-auto:release:$repo:$tag -->"

              cat > /tmp/item.md <<EOF
          $marker
          # $repo $tag

          ${name:-Release $tag}

          - **Repository:** https://github.com/$full_name
          - **Release:** $url
          - **Prerelease:** $prerelease

          完整变更、安装与迁移信息以 Release 页面为准。
          EOF
              publish_once "$marker" "[Release] $repo $tag" /tmp/item.md
            done < <(jq -c '.[] | select(.draft == false)' <<<"$releases")
          done < <(jq -r '.[].full_name' <<<"$repos_json")

          package_token="${ORG_PACKAGE_TOKEN:-$GH_TOKEN}"
          package_error="/tmp/package-api-error.txt"
          : > "$package_error"

          if packages="$(GH_TOKEN="$package_token" gh api "/orgs/$ORG_NAME/packages?package_type=container&per_page=100" 2>"$package_error")"; then
            if ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$packages"; then
              echo "::warning::GitHub Packages API returned an unexpected response; package announcements were skipped."
              packages='[]'
            fi
          else
            echo "::warning::GitHub Packages sync is unavailable with the current token; Release, repository and digest publishing remain active. Configure ORG_PACKAGE_TOKEN with read access to organization packages to enable package announcements."
            packages='[]'
          fi

          while read -r package; do
            [ -n "$package" ] || continue
            package_name="$(jq -r '.name' <<<"$package")"
            encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$package_name")"

            versions_error="/tmp/package-versions-error.txt"
            : > "$versions_error"
            if versions="$(GH_TOKEN="$package_token" gh api "/orgs/$ORG_NAME/packages/container/$encoded/versions?per_page=5" 2>"$versions_error")"; then
              versions="$(json_array_or_empty "$versions")"
            else
              echo "::warning::Unable to read versions for package $package_name; skipping it."
              continue
            fi

            if [ "$BOOTSTRAP" = "true" ]; then
              versions="$(jq '.[0:1]' <<<"$versions")"
            fi

            while read -r version; do
              [ -n "$version" ] || continue
              created="$(jq -r '.created_at' <<<"$version")"
              created_epoch="$(date -u -d "$created" +%s)"
              if [ "$BOOTSTRAP" != "true" ] && [ "$created_epoch" -lt "$cutoff_epoch" ]; then
                continue
              fi

              version_id="$(jq -r '.id' <<<"$version")"
              tags="$(jq -r '.metadata.container.tags // [] | join(", ")' <<<"$version")"
              marker="<!-- lingxi-auto:package:$package_name:$version_id -->"
              package_url="https://github.com/orgs/$ORG_NAME/packages/container/package/$encoded"

              cat > /tmp/item.md <<EOF
          $marker
          # Package update: $package_name

          - **Package:** $package_url
          - **Tags:** ${tags:-untagged}
          - **Published:** $created

          该通知由 LingXi 社区发布器从 GitHub Packages 自动同步。
          EOF
              publish_once "$marker" "[Package] $package_name ${tags:+— $tags}" /tmp/item.md
            done < <(jq -c '.[]' <<<"$versions")
          done < <(jq -c '.[]' <<<"$packages")

  digest:
    name: Publish weekly development digest
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.action == 'bootstrap' || inputs.action == 'digest')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 0' && vars.DISCUSSIONS_AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Publish digest
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'bootstrap' }}
        shell: bash
        run: |
          set -euo pipefail

          context="$(
            gh api graphql \
              -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){id discussionCategories(first:50){nodes{id slug}} discussions(first:100,orderBy:{field:UPDATED_AT,direction:DESC}){nodes{body}}}}' \
              -F owner="$ORG_NAME" -F name="$SOURCE_REPO"
          )"
          repo_id="$(jq -r '.data.repository.id // empty' <<<"$context")"
          category_id="$(jq -r --arg slug "$ANNOUNCEMENTS_SLUG" '.data.repository.discussionCategories.nodes[] | select(.slug==$slug) | .id' <<<"$context")"
          [ -n "$repo_id" ] && [ -n "$category_id" ] || { echo "::error::Missing Announcements category."; exit 1; }

          if [ "$BOOTSTRAP" = "true" ]; then
            since="$(date -u -d '30 days ago' +%F)"
            period="Current Development Snapshot"
            marker="<!-- lingxi-auto:development-snapshot:v1 -->"
            title="[Progress] Current Development Snapshot"
          else
            since="$(date -u -d '7 days ago' +%F)"
            week="$(date -u +%G-W%V)"
            period="$week"
            marker="<!-- lingxi-auto:weekly-digest:$week -->"
            title="[Progress] $week — LingXi Weekly Development Digest"
          fi

          if jq -r '.data.repository.discussions.nodes[]?.body' <<<"$context" | grep -Fq "$marker"; then
            echo "Digest already exists."
            exit 0
          fi

          query="org:$ORG_NAME is:pr is:merged merged:>=$since"
          prs="$(gh api --method GET /search/issues -f q="$query" -f per_page=100 --jq '.items')"

          cat > /tmp/body.md <<EOF
          $marker
          # $period

          本摘要自动聚合 LingXi 组织最近的合并开发活动，便于社区快速了解当前工程方向。

          ## Merged pull requests

          EOF

          count="$(jq 'length' <<<"$prs")"
          if [ "$count" -eq 0 ]; then
            echo "- 本周期暂无已合并 Pull Request。" >> /tmp/body.md
          else
            jq -r '.[] | "- [" + .repository_url + "/pull/" + ((.pull_request.url | split("/") | last)) + "](" + .html_url + ") — " + .title + " by @" + .user.login' <<<"$prs" \
              | sed -E 's#\[https://api.github.com/repos/([^/]+/[^/]+)/pull/([0-9]+)\]#\[\1#\2\]#' \
              >> /tmp/body.md
          fi

          cat >> /tmp/body.md <<EOF

          ---
          Generated from merged Pull Requests since **$since**.
          EOF

          body="$(cat /tmp/body.md)"
          gh api graphql \
            -f query='mutation($repository:ID!,$category:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repository,categoryId:$category,title:$title,body:$body}){discussion{url}}}' \
            -F repository="$repo_id" -F category="$category_id" -f title="$title" -f body="$body"
