name: 社区配置校验

on:
  pull_request:
    paths:
      - '.github/DISCUSSION_TEMPLATE/**'
      - '.github/workflows/discussion-governance.yml'
      - '.github/workflows/community-publisher.yml'
      - '.github/workflows/community-config-validation.yml'
      - 'docs/community-discussions.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 校验讨论表单与工作流
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: 解析 YAML 并校验必要配置
        shell: ruby {0}
        run: |
          require 'yaml'

          forms = {
            '公告' => '.github/DISCUSSION_TEMPLATE/公告.yml',
            '想法与需求' => '.github/DISCUSSION_TEMPLATE/想法与需求.yml',
            '每周任务' => '.github/DISCUSSION_TEMPLATE/每周任务.yml',
            '任务提交' => '.github/DISCUSSION_TEMPLATE/任务提交.yml',
            '技术札记' => '.github/DISCUSSION_TEMPLATE/技术札记.yml'
          }

          expected_titles = {
            '公告' => '[公告] ',
            '想法与需求' => '[需求] ',
            '每周任务' => '[每周任务] ',
            '任务提交' => '[任务提交] ',
            '技术札记' => '[技术札记] '
          }

          forms.each do |slug, path|
            raise "缺少文件：#{path}" unless File.file?(path)
            data = YAML.safe_load(File.read(path), aliases: false)
            raise "#{path}：body 必须是非空数组" unless data.is_a?(Hash) && data['body'].is_a?(Array) && !data['body'].empty?
            raise "#{path}：至少需要一个非 markdown 字段" unless data['body'].any? { |field| field['type'] != 'markdown' }
            raise "#{path}：标题前缀必须为 #{expected_titles[slug]}" unless data['title'] == expected_titles[slug]

            ids = data['body'].filter_map { |field| field['id'] }
            raise "#{path}：存在重复字段 id" unless ids.uniq.length == ids.length

            labels = data['body'].filter_map { |field| field.dig('attributes', 'label') }
            raise "#{path}：字段名称不得继续使用中英双语斜杠格式" if labels.any? { |label| label.include?(' / ') }
          end

          old_forms = %w[
            announcements.yml
            ideas-and-requests.yml
            weekly-missions.yml
            submissions.yml
            engineering-notes.yml
          ]
          old_forms.each do |name|
            path = File.join('.github/DISCUSSION_TEMPLATE', name)
            raise "旧英文分类表单仍然存在：#{path}" if File.exist?(path)
          end

          workflow_paths = %w[
            .github/workflows/discussion-governance.yml
            .github/workflows/community-publisher.yml
          ]

          workflow_paths.each do |path|
            raise "缺少文件：#{path}" unless File.file?(path)
            YAML.safe_load(File.read(path), aliases: false)
          end

          governance = File.read('.github/workflows/discussion-governance.yml')
          publisher = File.read('.github/workflows/community-publisher.yml')

          %w[想法与需求 每周任务 任务提交 技术札记].each do |slug|
            raise "治理工作流未引用中文分类 slug：#{slug}" unless governance.include?(slug)
          end

          raise '发布工作流必须指向中文“公告”分类' unless publisher.include?('ANNOUNCEMENTS_SLUG: 公告')
          raise '定时发布必须继续受 DISCUSSIONS_AUTOMATION_ENABLED 控制' unless publisher.include?('DISCUSSIONS_AUTOMATION_ENABLED')
          raise '需求审批命令必须继续保留 /approve' unless governance.include?('/approve')
          raise '任务验收命令必须继续保留 /accept' unless governance.include?('/accept')
          raise '社区发布器不得依赖 updateDiscussion 修改既有自动公告' if publisher.include?('updateDiscussion')
          raise '中文组织总览必须使用独立迁移标识' unless publisher.include?('organization-overview:zh-v1')
          raise '中文开发快照必须使用独立迁移标识' unless publisher.include?('development-snapshot:zh-v1')

          legacy_slugs = %w[announcements ideas-and-requests weekly-missions submissions engineering-notes]
          legacy_slugs.each do |slug|
            raise "治理工作流仍引用旧英文 slug：#{slug}" if governance.include?(slug)
            raise "发布工作流仍引用旧英文 slug：#{slug}" if publisher.include?(slug)
          end

          puts "已校验 #{forms.length} 个中文讨论表单和 #{workflow_paths.length} 个社区工作流。"
