name: 社区配置检查

on:
  pull_request:
    paths:
      - '.github/DISCUSSION_TEMPLATE/**'
      - '.github/workflows/discussion-governance.yml'
      - '.github/workflows/lingxi-pr-governance.yml'
      - '.github/workflows/collaboration-smoke.yml'
      - '.github/workflows/community-publisher.yml'
      - '.github/workflows/community-config-validation.yml'
      - '.github/actions/**'
      - 'docs/community-discussions.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 配置检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: 检查配置
        shell: ruby {0}
        run: |
          require 'yaml'

          forms = {
            'announcements' => '.github/DISCUSSION_TEMPLATE/announcements.yml',
            'ideas-and-requests' => '.github/DISCUSSION_TEMPLATE/ideas-and-requests.yml',
            'weekly-missions' => '.github/DISCUSSION_TEMPLATE/weekly-missions.yml',
            'submissions' => '.github/DISCUSSION_TEMPLATE/submissions.yml',
            'engineering-notes' => '.github/DISCUSSION_TEMPLATE/engineering-notes.yml'
          }
          expected_titles = {
            'announcements' => '[公告] ',
            'ideas-and-requests' => '[需求] ',
            'weekly-missions' => '[每周任务] ',
            'submissions' => '[任务提交] ',
            'engineering-notes' => '[技术札记] '
          }

          parsed = {}
          forms.each do |slug, path|
            raise "缺少文件：#{path}" unless File.file?(path)
            data = YAML.safe_load(File.read(path), aliases: false)
            parsed[slug] = data
            raise "#{path}：body 必须是非空数组" unless data.is_a?(Hash) && data['body'].is_a?(Array) && !data['body'].empty?
            raise "#{path}：至少需要一个非 markdown 字段" unless data['body'].any? { |field| field['type'] != 'markdown' }
            raise "#{path}：标题前缀必须为 #{expected_titles[slug]}" unless data['title'] == expected_titles[slug]
            ids = data['body'].filter_map { |field| field['id'] }
            raise "#{path}：存在重复字段 id" unless ids.uniq.length == ids.length
          end

          weekly_ids = parsed['weekly-missions']['body'].filter_map { |f| f['id'] }
          %w[deliverable_mode submission_required requirements linked_issue].each do |id|
            raise "每周任务缺少字段：#{id}" unless weekly_ids.include?(id)
          end
          submission_ids = parsed['submissions']['body'].filter_map { |f| f['id'] }
          %w[submission_type artifact_url submitted_content].each do |id|
            raise "任务提交缺少字段：#{id}" unless submission_ids.include?(id)
          end

          forbidden_files = %w[公告.yml 想法与需求.yml 每周任务.yml 任务提交.yml 技术札记.yml form-test.yml]
          forbidden_files.each do |name|
            path = File.join('.github/DISCUSSION_TEMPLATE', name)
            raise "不应保留临时或中文 slug 表单：#{path}" if File.exist?(path)
          end

          required_files = %w[
            .github/workflows/discussion-governance.yml
            .github/workflows/lingxi-pr-governance.yml
            .github/workflows/collaboration-smoke.yml
            .github/workflows/community-publisher.yml
            .github/actions/pr-approval-gate/action.yml
            .github/actions/issue-approval/action.yml
          ]
          required_files.each do |path|
            raise "缺少文件：#{path}" unless File.file?(path)
            YAML.safe_load(File.read(path), aliases: false)
          end

          governance = File.read('.github/workflows/discussion-governance.yml')
          pr_wrapper = File.read('.github/workflows/lingxi-pr-governance.yml')
          smoke = File.read('.github/workflows/collaboration-smoke.yml')
          publisher = File.read('.github/workflows/community-publisher.yml')
          pr_gate = File.read('.github/actions/pr-approval-gate/action.yml')
          issue_gate = File.read('.github/actions/issue-approval/action.yml')

          %w[ideas-and-requests weekly-missions submissions engineering-notes].each do |slug|
            raise "社区协作未引用分类 slug：#{slug}" unless governance.include?(slug)
          end
          raise '社区协作必须使用 mentors Team' unless governance.include?('MENTOR_TEAM: mentors')
          raise '每周任务必须通知 builders Team' unless governance.include?('MISSION_AUDIENCE_TEAM: builders')
          raise '社区协作必须读取 ORG_GOVERNANCE_TOKEN' unless governance.include?('ORG_GOVERNANCE_TOKEN')
          raise '不得继续使用固定导师用户名变量' if governance.include?('MENTOR_ONE') || governance.include?('MENTOR_TWO')

          %w[/approve /accept /needs-work /close-mission].each do |command|
            raise "社区协作缺少命令：#{command}" unless governance.include?(command)
          end
          raise '需求确认后的 Issue 必须带来源标记' unless governance.include?('lingxi-governance:issue-approved-by:')
          raise '每周任务解析字段与表单不一致' unless governance.include?('是否需要单独提交成果')

          raise '发布工作流必须指向 announcements 分类' unless publisher.include?('ANNOUNCEMENTS_SLUG: announcements')
          raise '定时发布必须继续受 DISCUSSIONS_AUTOMATION_ENABLED 控制' unless publisher.include?('DISCUSSIONS_AUTOMATION_ENABLED')
          raise '社区发布器不得依赖 updateDiscussion' if publisher.include?('updateDiscussion')

          raise 'Owner PR 必须无需额外批准' unless pr_gate.include?('无需额外批准')
          raise 'PR 检查必须通过 Team API 读取 Mentors' unless pr_gate.include?('/teams/$MENTOR_TEAM/members')
          raise 'Builder PR 必须要求 2 位 Mentors' unless pr_gate.include?('需要 2 位 Mentors 批准')
          raise 'Mentor PR 必须只要求 Owner' unless pr_gate.include?('需要 @$OWNER_LOGIN 批准')
          raise 'PR 检查必须支持无副作用角色验证' unless pr_gate.include?('check_only') && pr_gate.include?('expected_role')
          raise 'PR 检查不得使用固定导师用户名' if pr_gate.include?('MENTOR_ONE') || pr_gate.include?('MENTOR_TWO')

          raise 'PR workflow 必须传入 ORG_GOVERNANCE_TOKEN' unless pr_wrapper.include?('ORG_GOVERNANCE_TOKEN')
          raise 'PR workflow 必须使用 mentors Team' unless pr_wrapper.include?('mentor_team: mentors')

          raise 'Issue 确认必须保留 /approve-issue' unless issue_gate.include?('/approve-issue')
          raise 'Issue 确认必须校验 Team membership' unless issue_gate.include?('/teams/$MENTOR_TEAM/memberships/$user')

          raise '协作规则检查必须读取 ORG_GOVERNANCE_TOKEN' unless smoke.include?('ORG_GOVERNANCE_TOKEN')
          raise '协作规则检查必须覆盖 Owner PR' unless smoke.include?('expected_role: owner')
          raise '协作规则检查必须覆盖 Mentor PR' unless smoke.include?('expected_role: mentor')
          raise '协作规则检查必须覆盖 Builder PR' unless smoke.include?('expected_role: contributor')

          puts "社区配置检查通过。"
