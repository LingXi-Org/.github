name: 社区讨论治理

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

permissions:
  contents: read
  discussions: write
  issues: write

concurrency:
  group: discussion-governance-${{ github.event.discussion.number || github.run_id }}
  cancel-in-progress: false

env:
  ORG_NAME: LingXi-Org
  APPROVER: leecyang

jobs:
  triage:
    name: 新讨论分类与初始化
    if: github.event_name == 'discussion' && github.event.action == 'created'
    runs-on: ubuntu-latest
    steps:
      - name: 分类讨论并初始化状态
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: ${{ github.event.discussion.category.slug }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
          AUTHOR: ${{ github.event.discussion.user.login }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
        shell: bash
        run: |
          set -euo pipefail

          repo_name="${GITHUB_REPOSITORY#*/}"

          ensure_label() {
            gh label create "$1" --repo "$GITHUB_REPOSITORY" --color "$2" --description "$3" --force >/dev/null
          }

          label_id() {
            gh api graphql \
              -f query='query($owner:String!,$name:String!,$label:String!){repository(owner:$owner,name:$name){label(name:$label){id}}}' \
              -F owner="$GITHUB_REPOSITORY_OWNER" -F name="$repo_name" -F label="$1" \
              --jq '.data.repository.label.id'
          }

          add_label() {
            local id
            id="$(label_id "$1")"
            gh api graphql \
              -f query='mutation($discussion:ID!,$label:ID!){addLabelsToLabelable(input:{labelableId:$discussion,labelIds:[$label]}){clientMutationId}}' \
              -F discussion="$DISCUSSION_ID" -F label="$id" >/dev/null
          }

          comment_file() {
            local body
            body="$(cat "$1")"
            gh api graphql \
              -f query='mutation($discussion:ID!,$body:String!){addDiscussionComment(input:{discussionId:$discussion,body:$body}){comment{url}}}' \
              -F discussion="$DISCUSSION_ID" -f body="$body" >/dev/null
          }

          case "$CATEGORY" in
            想法与需求)
              ensure_label "proposal:review" "FBCA04" "等待维护者审核"
              ensure_label "proposal:approved" "0E8A16" "已批准进入工程议题"
              ensure_label "proposal:declined" "B60205" "当前不进入工程实现"
              add_label "proposal:review"

              cat > /tmp/comment.md <<EOF
          @$APPROVER 有新的想法或需求等待审批。

          **提出者**：@$AUTHOR

          审批前请先确认目标仓库、需求边界和预期结果。维护者可回复：

          - \`/approve\`：按表单中的目标仓库批准
          - \`/approve LingxiSkills\`：批准并覆盖目标仓库
          - \`/decline\`：当前不进入工程议题

          批准后，机器人会为 @$AUTHOR 生成对应仓库的预填议题创建入口；议题仍由需求提出者本人提交。
          EOF
              comment_file /tmp/comment.md
              ;;

            每周任务)
              ensure_label "mission:open" "1D76DB" "每周任务进行中"
              ensure_label "mission:closed" "6E7781" "每周任务已结束"
              add_label "mission:open"

              cat > /tmp/comment.md <<EOF
          本周任务已开放。

          参与者请不要把完整成果直接堆叠在任务评论区。完成后请前往 **任务提交** 分类创建独立提交，并在表单中关联本任务：

          https://github.com/orgs/$ORG_NAME/discussions/categories/%E4%BB%BB%E5%8A%A1%E6%8F%90%E4%BA%A4

          维护者可在任务结束后回复 \`/close-mission\` 关闭本周任务。
          EOF
              comment_file /tmp/comment.md
              ;;

            任务提交)
              ensure_label "submission:received" "5319E7" "已收到社区任务提交"
              ensure_label "submission:accepted" "0E8A16" "任务提交已通过"
              ensure_label "submission:needs-work" "D93F0B" "任务提交需要继续完善"
              add_label "submission:received"

              mission_url="$(
                python3 - <<'PY'
          import os, re
          body = os.environ.get("DISCUSSION_BODY", "")
          match = re.search(r"(?ms)^### (?:关联任务 / Mission discussion|关联任务)\s*\n+\s*(\S+)", body)
          print(match.group(1).strip() if match else "")
          PY
              )"

              cat > /tmp/comment.md <<EOF
          已收到 @$AUTHOR 的任务提交。

          **关联任务**：${mission_url:-未识别，请检查表单中的关联任务链接}

          维护者评审命令：

          - \`/accept\`：标记为已通过
          - \`/needs-work\`：标记为需要继续完善
          EOF
              comment_file /tmp/comment.md
              ;;

            技术札记)
              ensure_label "engineering-note" "0969DA" "技术文章或工程札记"
              add_label "engineering-note"
              ;;

            公告)
              ensure_label "announcement" "0052CC" "LingXi 官方公告"
              add_label "announcement"
              ;;

            *)
              echo "当前分类未配置自动化：$CATEGORY"
              ;;
          esac

  maintainer-command:
    name: 执行维护者命令
    if: >-
      github.event_name == 'discussion_comment' &&
      github.event.action == 'created' &&
      github.actor == 'leecyang'
    runs-on: ubuntu-latest
    steps:
      - name: 处理审批、关闭与验收命令
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: ${{ github.event.discussion.category.slug }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
          DISCUSSION_URL: ${{ github.event.discussion.html_url }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          AUTHOR: ${{ github.event.discussion.user.login }}
          COMMAND: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          repo_name="${GITHUB_REPOSITORY#*/}"
          command_line="${COMMAND%%$'\n'*}"
          command_line="${command_line%$'\r'}"

          ensure_label() {
            gh label create "$1" --repo "$GITHUB_REPOSITORY" --color "$2" --description "$3" --force >/dev/null
          }

          label_id() {
            gh api graphql \
              -f query='query($owner:String!,$name:String!,$label:String!){repository(owner:$owner,name:$name){label(name:$label){id}}}' \
              -F owner="$GITHUB_REPOSITORY_OWNER" -F name="$repo_name" -F label="$1" \
              --jq '.data.repository.label.id'
          }

          add_label() {
            local id
            id="$(label_id "$1")"
            gh api graphql \
              -f query='mutation($discussion:ID!,$label:ID!){addLabelsToLabelable(input:{labelableId:$discussion,labelIds:[$label]}){clientMutationId}}' \
              -F discussion="$DISCUSSION_ID" -F label="$id" >/dev/null
          }

          remove_label() {
            local id
            id="$(label_id "$1" 2>/dev/null || true)"
            if [ -n "$id" ] && [ "$id" != "null" ]; then
              gh api graphql \
                -f query='mutation($discussion:ID!,$label:ID!){removeLabelsFromLabelable(input:{labelableId:$discussion,labelIds:[$label]}){clientMutationId}}' \
                -F discussion="$DISCUSSION_ID" -F label="$id" >/dev/null || true
            fi
          }

          comment_text() {
            gh api graphql \
              -f query='mutation($discussion:ID!,$body:String!){addDiscussionComment(input:{discussionId:$discussion,body:$body}){comment{url}}}' \
              -F discussion="$DISCUSSION_ID" -f body="$1" >/dev/null
          }

          approve_request() {
            local result target issue_url
            result="$(COMMAND_LINE="$command_line" python3 - <<'PY'
          import os, re, urllib.parse

          allowed = {"LingxiLearn", "LingxiGraph", "LingxiSkills", "LingxiIdentity", "LingxiNext"}
          body = os.environ.get("DISCUSSION_BODY", "")
          command = os.environ.get("COMMAND_LINE", "").strip()
          title = os.environ.get("DISCUSSION_TITLE", "").strip()
          discussion_url = os.environ.get("DISCUSSION_URL", "")
          author = os.environ.get("AUTHOR", "")

          match = re.search(r"(?ms)^### (?:目标仓库 / Target repository|目标仓库)\s*\n+\s*([^\n]+)", body)
          selected = match.group(1).strip() if match else ""
          parts = command.split()
          override = parts[1].strip() if len(parts) > 1 else ""
          target = override or selected

          if target not in allowed:
              print("ERROR|目标仓库未确定。请使用 `/approve LingxiSkills` 这类命令明确指定仓库。")
              raise SystemExit

          issue_title = title
          for prefix in ("[Request]", "[需求]"):
              if issue_title.startswith(prefix):
                  issue_title = issue_title[len(prefix):].strip()
                  break
          issue_title = f"[需求] {issue_title}"

          issue_body = f"""## 来源

          本议题已在 LingXi 组织讨论区完成需求讨论并获得维护者批准。

          - 原讨论：{discussion_url}
          - 提出者：@{author}

          ## 实现要求

          请以原讨论中已经形成的需求边界和验收结论为准。若实现过程中需要改变公共接口、兼容性或安全边界，应先回到原讨论补充设计共识。
          """

          query = urllib.parse.urlencode({"title": issue_title, "body": issue_body})
          url = f"https://github.com/LingXi-Org/{target}/issues/new?{query}"
          print(f"OK|{target}|{url}")
          PY
            )"

            if [[ "$result" == ERROR\|* ]]; then
              comment_text "@$APPROVER ${result#ERROR|}"
              return 0
            fi

            IFS='|' read -r _ target issue_url <<<"$result"
            ensure_label "proposal:review" "FBCA04" "等待维护者审核"
            ensure_label "proposal:approved" "0E8A16" "已批准进入工程议题"
            add_label "proposal:approved"
            remove_label "proposal:review"
            remove_label "proposal:declined"

            cat > /tmp/comment.md <<EOF
          ✅ 需求已通过维护者审批。

          **目标仓库**：\`LingXi-Org/$target\`

          @$AUTHOR 请使用下面的入口创建工程议题。议题将由你的 GitHub 账号创建，并自动带上原讨论引用：

          **[在 $target 创建议题]($issue_url)**

          后续实现、验收和拉取请求跟踪应转移到该议题；需求范围发生实质变化时，再回到本讨论重新确认。
          EOF
            comment_text "$(cat /tmp/comment.md)"
          }

          decline_request() {
            ensure_label "proposal:review" "FBCA04" "等待维护者审核"
            ensure_label "proposal:declined" "B60205" "当前不进入工程实现"
            add_label "proposal:declined"
            remove_label "proposal:review"
            remove_label "proposal:approved"
            comment_text "本需求当前不进入工程议题。@$AUTHOR 如有新的约束、证据或使用场景，可以继续在本讨论补充后重新申请评审。"
          }

          close_mission() {
            ensure_label "mission:open" "1D76DB" "每周任务进行中"
            ensure_label "mission:closed" "6E7781" "每周任务已结束"
            add_label "mission:closed"
            remove_label "mission:open"
            comment_text "本周任务已结束。已有任务提交可以继续评审；新的成果建议参加后续任务。"
          }

          review_submission() {
            ensure_label "submission:accepted" "0E8A16" "任务提交已通过"
            ensure_label "submission:needs-work" "D93F0B" "任务提交需要继续完善"

            if [ "$command_line" = "/accept" ]; then
              add_label "submission:accepted"
              remove_label "submission:needs-work"
              comment_text "✅ @$AUTHOR 的任务提交已通过评审。"
            else
              add_label "submission:needs-work"
              remove_label "submission:accepted"
              comment_text "🛠️ @$AUTHOR 的任务提交需要继续完善。请根据评审意见更新成果或验证信息。"
            fi
          }

          case "$CATEGORY" in
            想法与需求)
              case "$command_line" in
                /approve|/approve\ *) approve_request ;;
                /decline) decline_request ;;
                *) echo "忽略未识别命令：$command_line" ;;
              esac
              ;;
            每周任务)
              if [ "$command_line" = "/close-mission" ]; then
                close_mission
              else
                echo "忽略未识别命令：$command_line"
              fi
              ;;
            任务提交)
              if [ "$command_line" = "/accept" ] || [ "$command_line" = "/needs-work" ]; then
                review_submission
              else
                echo "忽略未识别命令：$command_line"
              fi
              ;;
            *)
              echo "当前分类没有维护者命令：$CATEGORY"
              ;;
          esac
