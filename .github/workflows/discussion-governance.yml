name: 社区讨论治理

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

permissions:
  contents: read
  discussions: write
  issues: write

concurrency:
  group: discussion-governance-${{ github.event.discussion.number || github.run_id }}
  cancel-in-progress: false

env:
  ORG_NAME: LingXi-Org
  OWNER_LOGIN: leecyang
  MENTOR_ONE: ${{ vars.MENTOR_ONE }}
  MENTOR_TWO: ${{ vars.MENTOR_TWO }}
  MENTOR_TEAM: ${{ vars.MENTOR_TEAM }}
  MISSION_AUDIENCE_TEAM: ${{ vars.MISSION_AUDIENCE_TEAM }}

jobs:
  triage:
    name: 新讨论分类与初始化
    if: github.event_name == 'discussion' && github.event.action == 'created'
    runs-on: ubuntu-latest
    steps:
      - name: 初始化讨论状态
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: ${{ github.event.discussion.category.slug }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
          AUTHOR: ${{ github.event.discussion.user.login }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
        shell: bash
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"

          ensure_label() {
            gh label create "$1" --repo "$GITHUB_REPOSITORY" --color "$2" --description "$3" --force >/dev/null
          }

          label_id() {
            gh api graphql \
              -f query='query($owner:String!,$name:String!,$label:String!){repository(owner:$owner,name:$name){label(name:$label){id}}}' \
              -F owner="$GITHUB_REPOSITORY_OWNER" -F name="$repo_name" -F label="$1" \
              --jq '.data.repository.label.id // ""'
          }

          add_label() {
            local id
            id="$(label_id "$1")"
            [ -n "$id" ] || return 0
            gh api graphql \
              -f query='mutation($discussion:ID!,$label:ID!){addLabelsToLabelable(input:{labelableId:$discussion,labelIds:[$label]}){clientMutationId}}' \
              -F discussion="$DISCUSSION_ID" -F label="$id" >/dev/null
          }

          comment_text() {
            gh api graphql \
              -f query='mutation($discussion:ID!,$body:String!){addDiscussionComment(input:{discussionId:$discussion,body:$body}){comment{url}}}' \
              -F discussion="$DISCUSSION_ID" -f body="$1" >/dev/null
          }

          reviewers="@$OWNER_LOGIN"
          [ -n "${MENTOR_ONE:-}" ] && reviewers="$reviewers @$MENTOR_ONE"
          [ -n "${MENTOR_TWO:-}" ] && reviewers="$reviewers @$MENTOR_TWO"

          case "$CATEGORY" in
            ideas-and-requests)
              ensure_label "proposal:review" "FBCA04" "等待维护者审核"
              ensure_label "proposal:approved" "0E8A16" "已批准进入工程 Issue"
              ensure_label "proposal:declined" "B60205" "当前不进入工程实现"
              add_label "proposal:review"
              comment_text "$reviewers 有新的想法或需求等待审批。三人任意一人都可以回复 \`/approve\`、\`/approve LingxiSkills\` 或 \`/decline\`。批准后会为提出者生成目标仓库的预填 Issue 创建入口。"
              ;;

            weekly-missions)
              ensure_label "mission:open" "1D76DB" "每周任务进行中"
              ensure_label "mission:closed" "6E7781" "每周任务已结束"
              add_label "mission:open"

              submission_required="$(python3 - <<'PY'
          import os, re
          body = os.environ.get('DISCUSSION_BODY', '')
          m = re.search(r'(?ms)^### 是否需要在「任务提交」中独立提交\s*\n+\s*([^\n]+)', body)
          print(m.group(1).strip() if m else '')
          PY
              )"

              audience_team="${MISSION_AUDIENCE_TEAM:-builders}"
              audience="@$ORG_NAME/$audience_team"
              mentor_team="${MENTOR_TEAM:-mentors}"

              if [ "$submission_required" = "不需要" ]; then
                comment_text "$audience 本周任务已开放。本任务**不要求在「任务提交」中另开提交**，请按任务正文完成即可。$reviewers 或 @$ORG_NAME/$mentor_team 可在任务结束时由三位治理者中的任意一人回复 \`/close-mission\`。"
              else
                comment_text "$audience 本周任务已开放。完成后请前往 **任务提交** 创建独立成果：https://github.com/orgs/$ORG_NAME/discussions/categories/submissions 。成果可以是文档、链接、技术札记、PR、Issue 参与结果或 Demo。三位治理者中的任意一人可使用 \`/accept\` 或 \`/needs-work\` 验收。"
              fi
              ;;

            submissions)
              ensure_label "submission:received" "5319E7" "已收到社区任务提交"
              ensure_label "submission:accepted" "0E8A16" "任务提交已通过"
              ensure_label "submission:needs-work" "D93F0B" "任务提交需要继续完善"
              add_label "submission:received"

              mission_url="$(python3 - <<'PY'
          import os, re
          body = os.environ.get('DISCUSSION_BODY', '')
          m = re.search(r'(?ms)^### 关联任务\s*\n+\s*(\S+)', body)
          print(m.group(1).strip() if m else '')
          PY
              )"
              comment_text "已收到 @$AUTHOR 的任务提交。关联任务：${mission_url:-未识别}。$reviewers 三人任意一人都可以回复 \`/accept\` 或 \`/needs-work\` 完成验收。"
              ;;

            engineering-notes)
              ensure_label "engineering-note" "0969DA" "技术文章或工程札记"
              add_label "engineering-note"
              ;;

            announcements)
              ensure_label "announcement" "0052CC" "LingXi 官方公告"
              add_label "announcement"
              ;;

            *)
              echo "当前分类未配置自动化：$CATEGORY"
              ;;
          esac

  moderator-command:
    name: 处理治理命令
    if: github.event_name == 'discussion_comment' && github.event.action == 'created'
    runs-on: ubuntu-latest
    steps:
      - name: 执行三人治理命令
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: ${{ github.event.discussion.category.slug }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
          DISCUSSION_URL: ${{ github.event.discussion.html_url }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          AUTHOR: ${{ github.event.discussion.user.login }}
          ACTOR: ${{ github.actor }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          command="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | sed -e 's/[[:space:]]*$//')"

          case "$command" in
            /approve|/approve\ *|/decline|/close-mission|/accept|/needs-work) ;;
            *) echo "不是治理命令，跳过。"; exit 0 ;;
          esac

          authorized=false
          for user in "$OWNER_LOGIN" "${MENTOR_ONE:-}" "${MENTOR_TWO:-}"; do
            if [ -n "$user" ] && [ "$ACTOR" = "$user" ]; then authorized=true; fi
          done
          if [ "$authorized" != "true" ]; then
            echo "@$ACTOR 不在治理者名单中，忽略命令。"
            exit 0
          fi

          repo_name="${GITHUB_REPOSITORY#*/}"

          ensure_label() {
            gh label create "$1" --repo "$GITHUB_REPOSITORY" --color "$2" --description "$3" --force >/dev/null
          }
          label_id() {
            gh api graphql \
              -f query='query($owner:String!,$name:String!,$label:String!){repository(owner:$owner,name:$name){label(name:$label){id}}}' \
              -F owner="$GITHUB_REPOSITORY_OWNER" -F name="$repo_name" -F label="$1" \
              --jq '.data.repository.label.id // ""'
          }
          add_label() {
            local id; id="$(label_id "$1")"; [ -n "$id" ] || return 0
            gh api graphql -f query='mutation($discussion:ID!,$label:ID!){addLabelsToLabelable(input:{labelableId:$discussion,labelIds:[$label]}){clientMutationId}}' -F discussion="$DISCUSSION_ID" -F label="$id" >/dev/null
          }
          remove_label() {
            local id; id="$(label_id "$1")"; [ -n "$id" ] || return 0
            gh api graphql -f query='mutation($discussion:ID!,$label:ID!){removeLabelsFromLabelable(input:{labelableId:$discussion,labelIds:[$label]}){clientMutationId}}' -F discussion="$DISCUSSION_ID" -F label="$id" >/dev/null || true
          }
          comment_text() {
            gh api graphql -f query='mutation($discussion:ID!,$body:String!){addDiscussionComment(input:{discussionId:$discussion,body:$body}){comment{url}}}' -F discussion="$DISCUSSION_ID" -f body="$1" >/dev/null
          }

          if [[ "$command" == /approve* ]] && [ "$CATEGORY" = "ideas-and-requests" ]; then
            result="$(python3 - <<'PY'
          import os, re, urllib.parse
          allowed = {'LingxiLearn','LingxiGraph','LingxiSkills','LingxiIdentity','LingxiNext'}
          body = os.environ.get('DISCUSSION_BODY','')
          command = os.environ.get('COMMENT_BODY','').strip()
          title = os.environ.get('DISCUSSION_TITLE','').strip()
          discussion_url = os.environ.get('DISCUSSION_URL','')
          author = os.environ.get('AUTHOR','')
          actor = os.environ.get('ACTOR','')
          m = re.search(r'(?ms)^### 目标仓库\s*\n+\s*([^\n]+)', body)
          selected = m.group(1).strip() if m else ''
          parts = command.split()
          target = parts[1].strip() if len(parts) > 1 else selected
          if target not in allowed:
              print('ERROR|目标仓库未确定。请使用 `/approve LingxiSkills` 这类命令明确指定仓库。')
              raise SystemExit
          if title.startswith('[需求]'):
              title = title[len('[需求]'):].strip()
          issue_title = f'[需求] {title}'
          issue_body = f'''<!-- lingxi-governance:issue-approved-by:{actor} -->
          ## 来源

          本 Issue 已在 LingXi 组织讨论区由 @{actor} 批准。

          - 原讨论：{discussion_url}
          - 提出者：@{author}
          - 批准者：@{actor}

          ## 实现要求

          请以原讨论中形成的需求边界和验收结论为准。若实现过程中需要改变公共接口、兼容性或安全边界，应先回到原讨论补充设计共识。
          '''
          query = urllib.parse.urlencode({'title': issue_title, 'body': issue_body})
          print(f'OK|{target}|https://github.com/LingXi-Org/{target}/issues/new?{query}')
          PY
            )"
            if [[ "$result" == ERROR\|* ]]; then
              comment_text "@$ACTOR ${result#ERROR|}"
              exit 0
            fi
            IFS='|' read -r _ target issue_url <<<"$result"
            ensure_label "proposal:review" "FBCA04" "等待维护者审核"
            ensure_label "proposal:approved" "0E8A16" "已批准进入工程 Issue"
            ensure_label "proposal:declined" "B60205" "当前不进入工程实现"
            add_label "proposal:approved"
            remove_label "proposal:review"
            remove_label "proposal:declined"
            comment_text "✅ @$ACTOR 已批准该需求。@$AUTHOR 请使用 **[在 $target 创建 Issue]($issue_url)**，创建后的 Issue 会自动识别为已审批。"
            exit 0
          fi

          if [ "$command" = "/decline" ] && [ "$CATEGORY" = "ideas-and-requests" ]; then
            ensure_label "proposal:review" "FBCA04" "等待维护者审核"
            ensure_label "proposal:declined" "B60205" "当前不进入工程实现"
            add_label "proposal:declined"
            remove_label "proposal:review"
            remove_label "proposal:approved"
            comment_text "本需求当前不进入工程实现。审批者：@$ACTOR。@$AUTHOR 如有新的约束、证据或使用场景，可以继续补充后重新申请评审。"
            exit 0
          fi

          if [ "$command" = "/close-mission" ] && [ "$CATEGORY" = "weekly-missions" ]; then
            ensure_label "mission:open" "1D76DB" "每周任务进行中"
            ensure_label "mission:closed" "6E7781" "每周任务已结束"
            add_label "mission:closed"
            remove_label "mission:open"
            comment_text "本周任务已由 @$ACTOR 关闭。已有成果仍可继续评审。"
            exit 0
          fi

          if { [ "$command" = "/accept" ] || [ "$command" = "/needs-work" ]; } && [ "$CATEGORY" = "submissions" ]; then
            ensure_label "submission:received" "5319E7" "已收到社区任务提交"
            ensure_label "submission:accepted" "0E8A16" "任务提交已通过"
            ensure_label "submission:needs-work" "D93F0B" "任务提交需要继续完善"
            if [ "$command" = "/accept" ]; then
              add_label "submission:accepted"
              remove_label "submission:needs-work"
              comment_text "✅ @$AUTHOR 的任务提交已由 @$ACTOR 验收通过。"
            else
              add_label "submission:needs-work"
              remove_label "submission:accepted"
              comment_text "🛠️ @$AUTHOR 的任务提交由 @$ACTOR 标记为需要继续完善，请根据评审意见更新成果。"
            fi
            exit 0
          fi

          echo "命令与当前分类不匹配，跳过。"
