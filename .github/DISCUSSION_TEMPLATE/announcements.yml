title: "[公告] "
body:
  - type: markdown
    attributes:
      value: |
        用于发布 LingXi 的重要动态。请写清楚发生了什么、影响什么，并附上相关链接。
  - type: dropdown
    id: update_type
    attributes:
      label: 更新类型
      options:
        - 项目总览
        - 版本发布
        - 软件包发布
        - 开发进展
        - 新仓库
        - 重要变更
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 摘要
      description: 用 2–3 句话说明本次更新。
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 详细内容
      description: 补充主要变化、影响和需要注意的事项。
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: 相关链接
      description: 可填写仓库、版本、文档或 Pull Request 链接。
    validations:
      required: false
