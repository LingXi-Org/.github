title: "[需求] "
body:
  - type: markdown
    attributes:
      value: |
        先说明你遇到的问题和希望达到的结果。导师确认后，会提供对应仓库的 Issue 创建入口。
  - type: dropdown
    id: target_repository
    attributes:
      label: 目标仓库
      description: 请选择最接近该需求的项目；不确定时选择“组织级 / 暂不确定”。
      options:
        - LingxiLearn
        - LingxiGraph
        - LingxiSkills
        - LingxiIdentity
        - LingxiNext
        - Coze-Chainlit
        - 组织级 / 暂不确定
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: 需求场景
      description: 谁在什么情况下需要这项能力？
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 当前问题
      description: 现在遇到了什么问题？请优先描述问题本身。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 如果需求完成，你希望能够做什么？
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 参考资料
      description: 可选。可以附上截图、文档、论文、接口或已有实现。
    validations:
      required: false
  - type: dropdown
    id: participation
    attributes:
      label: 参与意愿
      options:
        - 我愿意参与实现
        - 我愿意参与测试或验收
        - 我主要提出需求
    validations:
      required: true
