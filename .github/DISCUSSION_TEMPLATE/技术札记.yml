title: "[技术札记] "
body:
  - type: markdown
    attributes:
      value: |
        技术札记用于沉淀可长期检索的工程经验、架构设计、实验结论和研究思考。正文应自洽，并尽量引用一手资料。
  - type: dropdown
    id: topic
    attributes:
      label: 主题
      options:
        - 架构设计
        - 智能体运行时
        - 技能体系
        - 前端工程
        - 研究与实验
        - 基础设施
        - 其他
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 摘要
      description: 用 2–4 句话说明本文讨论的问题和主要结论。
    validations:
      required: true
  - type: textarea
    id: article
    attributes:
      label: 正文
      description: 说明背景、方法、关键设计、结果和适用边界。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 参考资料
      description: 提供相关代码、文档、论文、议题、拉取请求或外部资料。
    validations:
      required: false
