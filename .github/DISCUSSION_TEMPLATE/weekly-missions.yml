title: "[Mission] "
body:
  - type: markdown
    attributes:
      value: |
        Weekly Mission 用于发布可独立完成、可验证、可复用的共建任务。每个任务应给出明确交付物和验收标准。
  - type: input
    id: mission_id
    attributes:
      label: 任务编号 / Mission ID
      description: 使用连续编号，例如 W01、W02。
      placeholder: W01
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: 目标 / Objective
      description: 本周希望参与者最终完成什么？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景 / Context
      description: 为什么值得做，以及它与 LingXi 当前开发方向的关系。
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: 交付物 / Deliverables
      description: 明确要求提交的代码、PR、Demo、文档、实验结果或其他工件。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准 / Acceptance criteria
      description: 给出可以直接判断是否完成的标准。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 参考资料 / References
      description: 相关仓库、Issue、文档、代码位置或学习材料。
    validations:
      required: false
  - type: input
    id: deadline
    attributes:
      label: 建议截止时间 / Suggested deadline
      placeholder: "2026-08-23"
    validations:
      required: false
  - type: textarea
    id: bonus
    attributes:
      label: 进阶挑战 / Bonus
      description: 可选。完成核心任务后可以继续探索的方向。
    validations:
      required: false
