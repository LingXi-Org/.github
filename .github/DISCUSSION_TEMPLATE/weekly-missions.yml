title: "[每周任务] "
body:
  - type: markdown
    attributes:
      value: |
        每周任务可以是阅读、写作、调研、实验、代码或参与 Issue。是否需要提交成果，以任务要求为准。
  - type: input
    id: mission_id
    attributes:
      label: 任务编号
      description: 使用连续编号，例如 W01、W02。
      placeholder: W01
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: 任务目标
      description: 参与者最终需要完成、理解或验证什么？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景
      description: 简要说明为什么要做这项任务。
    validations:
      required: true
  - type: dropdown
    id: deliverable_mode
    attributes:
      label: 主要完成方式
      options:
        - 文档 / 报告
        - 外部作品 / 链接
        - 技术札记
        - 代码提交（PR）
        - 实验 / Demo
        - 参与指定 Issue
        - 无需提交
        - 不限形式
    validations:
      required: true
  - type: dropdown
    id: submission_required
    attributes:
      label: 是否需要单独提交成果
      options:
        - 需要
        - 不需要
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: 任务要求
      description: 写清楚需要做什么、需要提交什么；如果无需提交，也请直接说明。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完成标准
      description: 怎样算完成？尽量给出可以直接判断的标准。
    validations:
      required: true
  - type: input
    id: linked_issue
    attributes:
      label: 关联 Issue
      description: 可选。如果任务直接对应某个 Issue，请填写链接。
      placeholder: "https://github.com/LingXi-Org/.../issues/..."
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: 参考资料
      description: 可选。可以填写仓库、文档、代码、论文或其他材料。
    validations:
      required: false
  - type: input
    id: deadline
    attributes:
      label: 建议截止时间
      placeholder: "2026-08-23"
    validations:
      required: false
  - type: textarea
    id: bonus
    attributes:
      label: 进阶挑战
      description: 可选。完成核心任务后可以继续探索的内容。
    validations:
      required: false
