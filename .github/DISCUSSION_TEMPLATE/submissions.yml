title: "[Submission] "
body:
  - type: markdown
    attributes:
      value: |
        每位参与者为自己的成果创建独立 Submission。请关联对应 Weekly Mission，并提供可复现的验证信息。
  - type: input
    id: mission_url
    attributes:
      label: 关联任务 / Mission discussion
      description: 对应 Weekly Mission 的 Discussion 链接。
      placeholder: "https://github.com/orgs/LingXi-Org/discussions/..."
    validations:
      required: true
  - type: dropdown
    id: target_repository
    attributes:
      label: 目标仓库 / Target repository
      options:
        - LingxiLearn
        - LingxiGraph
        - LingxiSkills
        - LingxiIdentity
        - LingxiNext
        - Independent / External repository
    validations:
      required: true
  - type: input
    id: artifact_url
    attributes:
      label: PR、仓库或 Demo / Artifact URL
      description: 提供主要交付物的可访问链接。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 完成内容 / Result
      description: 简要说明完成了什么，以及与任务要求的对应关系。
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: 设计与实现 / Design and implementation
      description: 说明关键设计选择，不要粘贴大段代码。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 验证 / Validation
      description: 提供测试、截图、性能数据或复现步骤。
    validations:
      required: true
  - type: textarea
    id: reflection
    attributes:
      label: 复盘 / Reflection
      description: 可选。记录遇到的问题、取舍和后续可以继续改进的方向。
    validations:
      required: false
