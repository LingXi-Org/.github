title: "[任务提交] "
body:
  - type: markdown
    attributes:
      value: |
        仅在任务要求单独提交时使用。你可以直接填写成果，也可以提交链接。
  - type: input
    id: mission_url
    attributes:
      label: 关联任务
      description: 填写对应每周任务的链接。
      placeholder: "https://github.com/orgs/LingXi-Org/discussions/..."
    validations:
      required: true
  - type: dropdown
    id: submission_type
    attributes:
      label: 成果类型
      options:
        - 文档 / 报告
        - 外部作品 / 链接
        - 技术札记
        - 代码提交（PR）
        - Issue 参与结果
        - Demo / 实验结果
        - 仓库 / 项目
        - 其他
    validations:
      required: true
  - type: dropdown
    id: target_repository
    attributes:
      label: 关联仓库
      options:
        - LingxiLearn
        - LingxiGraph
        - LingxiSkills
        - LingxiIdentity
        - LingxiNext
        - Coze-Chainlit
        - .github / 组织社区
        - 无需代码仓库
        - 独立 / 外部仓库
    validations:
      required: true
  - type: input
    id: artifact_url
    attributes:
      label: 成果链接
      description: 可选。可以填写技术札记、PR、Issue、文档、Demo 或其他作品链接。
      placeholder: "https://..."
    validations:
      required: false
  - type: textarea
    id: submitted_content
    attributes:
      label: 成果正文
      description: 可选。可以直接粘贴文档、报告、结论或其他成果内容。
    validations:
      required: false
  - type: textarea
    id: result
    attributes:
      label: 完成说明
      description: 简要说明你完成了什么，以及如何对应任务要求。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 证明材料
      description: 可选。可以附上测试结果、截图、数据或复现步骤。
    validations:
      required: false
  - type: textarea
    id: reflection
    attributes:
      label: 复盘
      description: 可选。记录遇到的问题、收获或后续可以继续改进的方向。
    validations:
      required: false
