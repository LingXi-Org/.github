title: "[Engineering Note] "
body:
  - type: markdown
    attributes:
      value: |
        技术札记用于沉淀可长期检索的工程经验、架构设计、实验结论和研究思考。正文应自洽，并尽量引用一手资料。
  - type: dropdown
    id: topic
    attributes:
      label: 主题 / Topic
      options:
        - Architecture
        - Agent Runtime
        - Skills
        - Frontend
        - Research
        - Infrastructure
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 摘要 / Summary
      description: 用 2-4 句话说明本文讨论的问题和主要结论。
    validations:
      required: true
  - type: textarea
    id: article
    attributes:
      label: 正文 / Article
      description: 说明背景、方法、关键设计、结果和适用边界。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 参考资料 / References
      description: 相关代码、文档、论文、Issue、PR 或外部资料。
    validations:
      required: false
