title: "[技术札记] "
body:
  - type: markdown
    attributes:
      value: |
        技术札记用于记录可复用的经验、设计和结论。尽量让读者不依赖上下文也能读懂。
  - type: dropdown
    id: topic
    attributes:
      label: 主题
      options:
        - 架构设计
        - 智能体运行时
        - 技能体系
        - 前端工程
        - 研究与实验
        - 基础设施
        - 其他
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 摘要
      description: 用 2–4 句话说明问题和主要结论。
    validations:
      required: true
  - type: textarea
    id: article
    attributes:
      label: 正文
      description: 写清楚背景、方法、关键结论和适用边界。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 参考资料
      description: 可选。可以填写代码、文档、论文、Issue、PR 或外部资料。
    validations:
      required: false
