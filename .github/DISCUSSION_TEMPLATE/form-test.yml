title: "[表单测试] "
body:
  - type: markdown
    attributes:
      value: |
        如果你看到下面的结构化字段，说明 Discussion Category Form 已经被 GitHub 正确加载。
  - type: input
    id: probe
    attributes:
      label: 测试字段
      description: 这是用于诊断分类表单加载能力的临时字段。
      placeholder: 请输入任意内容
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: 是否看到标准表单
      options:
        - 是
        - 否
    validations:
      required: true
