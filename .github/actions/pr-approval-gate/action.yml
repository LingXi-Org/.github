name: PR 审阅要求
description: 根据作者身份判断当前 PR 需要的审阅
inputs:
  github_token:
    required: true
  team_token:
    required: true
  org_name:
    required: true
  owner_login:
    required: true
  mentor_team:
    required: true
    default: mentors
  repository:
    required: true
  pr_number:
    required: true
  author:
    required: true
  head_sha:
    required: true
  event_action:
    required: false
  check_only:
    required: false
    default: "false"
  expected_role:
    required: false
runs:
  using: composite
  steps:
    - name: 检查审阅要求
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        TEAM_TOKEN: ${{ inputs.team_token }}
        ORG_NAME: ${{ inputs.org_name }}
        OWNER_LOGIN: ${{ inputs.owner_login }}
        MENTOR_TEAM: ${{ inputs.mentor_team }}
        REPOSITORY: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pr_number }}
        PR_AUTHOR: ${{ inputs.author }}
        HEAD_SHA: ${{ inputs.head_sha }}
        EVENT_ACTION: ${{ inputs.event_action }}
        CHECK_ONLY: ${{ inputs.check_only }}
        EXPECTED_ROLE: ${{ inputs.expected_role }}
      run: |
        set -euo pipefail

        assert_role() {
          local actual="$1"
          if [ -n "${EXPECTED_ROLE:-}" ] && [ "$actual" != "$EXPECTED_ROLE" ]; then
            echo "::error::角色检查失败。"
            exit 1
          fi
        }

        if [ "$PR_AUTHOR" = "$OWNER_LOGIN" ]; then
          if [ "$CHECK_ONLY" = "true" ]; then
            assert_role "owner"
            exit 0
          fi
          {
            echo "## 审阅要求"
            echo
            echo "- 作者：@$PR_AUTHOR"
            echo "- 需要：无需额外批准"
            echo "- 状态：✅ 已满足"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        if [ -z "${TEAM_TOKEN:-}" ]; then
          echo "::error::无法读取 Mentors 成员，请检查组织协作凭据。"
          exit 1
        fi

        mentor_members="$(
          GH_TOKEN="$TEAM_TOKEN" gh api --paginate \
            "/orgs/$ORG_NAME/teams/$MENTOR_TEAM/members?per_page=100" \
            --jq '.[].login'
        )"
        mentor_members="$(printf '%s\n%s\n' "$OWNER_LOGIN" "$mentor_members" | sed '/^$/d' | sort -fu)"

        is_mentor=false
        role="contributor"
        if grep -Fxiq "$PR_AUTHOR" <<<"$mentor_members"; then
          is_mentor=true
          role="mentor"
        fi

        if [ "$CHECK_ONLY" = "true" ]; then
          assert_role "$role"
          exit 0
        fi

        comment_once() {
          local marker='<!-- lingxi-governance:pr-review-request -->'
          local body="$1"
          local exists
          exists="$(gh api --paginate "/repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1 || true)"
          if [ -z "$exists" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "$marker
        $body" >/dev/null
          fi
        }

        if [ "$is_mentor" = "true" ]; then
          policy="需要 @$OWNER_LOGIN 批准"
          request_payload="$(printf '{\"reviewers\":[\"%s\"]}' "$OWNER_LOGIN")"
          gh api --method POST "/repos/$REPOSITORY/pulls/$PR_NUMBER/requested_reviewers" \
            --input - <<<"$request_payload" >/dev/null 2>&1 || true

          if [ "$EVENT_ACTION" = "opened" ] || [ "$EVENT_ACTION" = "reopened" ] || [ "$EVENT_ACTION" = "ready_for_review" ]; then
            comment_once "@$OWNER_LOGIN 请审阅 @$PR_AUTHOR 提交的 PR。"
          fi
        else
          policy="需要 2 位 Mentors 批准"
          request_payload="$(printf '{\"team_reviewers\":[\"%s\"]}' "$MENTOR_TEAM")"
          gh api --method POST "/repos/$REPOSITORY/pulls/$PR_NUMBER/requested_reviewers" \
            --input - <<<"$request_payload" >/dev/null 2>&1 || true

          if [ "$EVENT_ACTION" = "opened" ] || [ "$EVENT_ACTION" = "reopened" ] || [ "$EVENT_ACTION" = "ready_for_review" ]; then
            comment_once "@$ORG_NAME/$MENTOR_TEAM 请安排两位导师审阅 @$PR_AUTHOR 提交的 PR。"
          fi
        fi

        owner="${REPOSITORY%%/*}"
        repo="${REPOSITORY#*/}"
        reviews="$(
          gh api graphql \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviews(last:100){nodes{author{login} state submittedAt commit{oid}}}}}}' \
            -F owner="$owner" -F repo="$repo" -F number="$PR_NUMBER"
        )"

        export REVIEWS_JSON="$reviews"
        export MENTOR_MEMBERS="$mentor_members"
        export IS_MENTOR="$is_mentor"
        export REQUIRED_OWNER="$OWNER_LOGIN"
        export CURRENT_HEAD="$HEAD_SHA"

        result="$(python3 - <<'PY'
        import json, os

        data = json.loads(os.environ['REVIEWS_JSON'])
        mentors = {x.strip().lower(): x.strip() for x in os.environ['MENTOR_MEMBERS'].splitlines() if x.strip()}
        owner = os.environ['REQUIRED_OWNER']
        owner_key = owner.lower()
        head = os.environ['CURRENT_HEAD']
        author_is_mentor = os.environ['IS_MENTOR'] == 'true'
        nodes = (((data.get('data') or {}).get('repository') or {}).get('pullRequest') or {}).get('reviews', {}).get('nodes', []) or []

        latest = {}
        for review in nodes:
            login = ((review.get('author') or {}).get('login') or '').strip()
            commit = ((review.get('commit') or {}).get('oid') or '')
            key = login.lower()
            if not login or key not in mentors or commit != head:
                continue
            submitted = review.get('submittedAt') or ''
            if key not in latest or submitted >= latest[key][0]:
                latest[key] = (submitted, review.get('state') or '', login)

        approved = [v[2] for _, v in latest.items() if v[1] == 'APPROVED']

        if author_is_mentor:
            owner_ok = latest.get(owner_key, ('', '', ''))[1] == 'APPROVED'
            print('PASS=true' if owner_ok else 'PASS=false')
            print('APPROVED=' + ','.join(approved))
            print('PENDING=' + ('' if owner_ok else owner))
        else:
            unique = sorted(set(approved), key=str.lower)
            ok = len(unique) >= 2
            print('PASS=true' if ok else 'PASS=false')
            print('APPROVED=' + ','.join(unique))
            print('PENDING=' + ('' if ok else f'还需要 {2-len(unique)} 位导师'))
        PY
        )"

        passed="$(grep '^PASS=' <<<"$result" | cut -d= -f2-)"
        approved="$(grep '^APPROVED=' <<<"$result" | cut -d= -f2-)"
        pending="$(grep '^PENDING=' <<<"$result" | cut -d= -f2-)"

        {
          echo "## 审阅要求"
          echo
          echo "- 作者：@$PR_AUTHOR"
          echo "- 需要：$policy"
          echo "- 已批准：${approved:-无}"
          echo "- 还需：${pending:-无}"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$passed" != "true" ]; then
          echo "::error::${pending:-审阅尚未完成}"
          exit 1
        fi
