name: Issue 确认
description: 开发 Issue 由任意一位导师确认
inputs:
  github_token:
    required: true
  team_token:
    required: true
  org_name:
    required: true
  owner_login:
    required: true
  mentor_team:
    required: true
    default: mentors
  repository:
    required: true
  event_name:
    required: true
  issue_number:
    required: true
  issue_author:
    required: false
  issue_body:
    required: false
  actor:
    required: true
  comment_body:
    required: false
runs:
  using: composite
  steps:
    - name: 检查 Issue 状态
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        TEAM_TOKEN: ${{ inputs.team_token }}
        ORG_NAME: ${{ inputs.org_name }}
        OWNER_LOGIN: ${{ inputs.owner_login }}
        MENTOR_TEAM: ${{ inputs.mentor_team }}
        REPOSITORY: ${{ inputs.repository }}
        EVENT_NAME: ${{ inputs.event_name }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        ISSUE_AUTHOR: ${{ inputs.issue_author }}
        ISSUE_BODY: ${{ inputs.issue_body }}
        ACTOR: ${{ inputs.actor }}
        COMMENT_BODY: ${{ inputs.comment_body }}
      run: |
        set -euo pipefail

        ensure_label() {
          gh label create "$1" --repo "$REPOSITORY" --color "$2" --description "$3" --force >/dev/null
        }
        add_label() {
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --add-label "$1" >/dev/null
        }
        remove_label() {
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --remove-label "$1" >/dev/null 2>&1 || true
        }
        comment() {
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "$1" >/dev/null
        }
        is_mentor() {
          local user="$1"
          if [ "$user" = "$OWNER_LOGIN" ]; then
            return 0
          fi
          [ -n "${TEAM_TOKEN:-}" ] || return 1
          GH_TOKEN="$TEAM_TOKEN" gh api "/orgs/$ORG_NAME/teams/$MENTOR_TEAM/memberships/$user" \
            --jq 'select(.state == "active") | .state' >/dev/null 2>&1
        }

        ensure_label "issue:review" "FBCA04" "等待导师确认"
        ensure_label "issue:approved" "0E8A16" "已确认进入开发"
        ensure_label "issue:declined" "B60205" "暂不进入开发"

        if [ "$EVENT_NAME" = "issues" ]; then
          if grep -Fq '<!-- lingxi-governance:issue-approved-by:' <<<"${ISSUE_BODY:-}"; then
            add_label "issue:approved"
            remove_label "issue:review"
            remove_label "issue:declined"
            comment "✅ 该 Issue 已完成需求确认，可以进入开发。"
          else
            add_label "issue:review"
            comment "@$ORG_NAME/$MENTOR_TEAM 这个 Issue 需要一位导师确认。回复 \`/approve-issue\` 通过，或回复 \`/decline-issue\` 暂不进入开发。"
          fi
          exit 0
        fi

        command="$(printf '%s' "${COMMENT_BODY:-}" | tr -d '\r' | sed -e 's/[[:space:]]*$//')"
        case "$command" in
          /approve-issue|/decline-issue) ;;
          *) exit 0 ;;
        esac

        if ! is_mentor "$ACTOR"; then
          comment "@$ACTOR 该操作仅对 @$ORG_NAME/$MENTOR_TEAM 开放。"
          exit 0
        fi

        if [ "$command" = "/approve-issue" ]; then
          add_label "issue:approved"
          remove_label "issue:review"
          remove_label "issue:declined"
          comment "✅ 已确认，可以进入开发。"
        else
          add_label "issue:declined"
          remove_label "issue:review"
          remove_label "issue:approved"
          comment "暂不进入开发。如有新信息，可以继续讨论后再次确认。"
        fi
